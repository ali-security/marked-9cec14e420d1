name: "Tests"
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Extra jasmine arguments (e.g. --filter=<regex>) to scope the unit/spec runs; empty runs the full suite'
        required: false
        default: ''

jobs:
  Test:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      matrix:
        node_version: ['lts/*', 'node', '14']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Install Node
        uses: dcodeIO/setup-node-nvm@master
        with:
          node-version: ${{ matrix.node_version }}
      - name: Install Dependencies
        run: npm ci
      - name: Run Unit Tests 👩🏽‍💻
        run: npm run test:unit -- ${{ inputs.test-filter }}
      - name: Run Spec Tests 👩🏽‍💻
        run: npm run test:specs -- ${{ inputs.test-filter }}

  Lint:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Install Dependencies
        run: npm ci
      - name: Lint ✨
        run: npm run test:lint

  Release:
    needs: [Test, Lint]
    if: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Install Dependencies
        run: npm ci
      - name: Install faketime
        run: sudo apt-get update && sudo apt-get install -y faketime
      - name: Build 🗜️
        env:
          LD_PRELOAD: /usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1
          FAKETIME: '@2021-05-27 16:17:04'
        run: |
          npm run build
          if ! git diff --quiet; then
            git config --global user.email "<>"
            git config --global user.name "MarkedJS bot"
            git commit -am "🗜️ build [skip ci]"
          fi
      - name: Pack 📦
        run: |
          mkdir -p dist
          npm pack --pack-destination dist
      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: dist/*.tgz
          if-no-files-found: error

  Skip:
    if: contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip CI 🚫
        run: echo skip ci
